[workspace]
members = [".", "bindings/python"]
resolver = "2"

# The one version of the release: the crate, and through maturin the Python
# package, both read it from here.
[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Pau Montserrat <pau@usetaizen.com>"]
repository = "https://github.com/pau-mensa/lateweave"
homepage = "https://github.com/pau-mensa/lateweave"

[package]
name = "lateweave"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/lateweave"
readme = "README.md"
description = "Composable candidate generation and optional late-interaction reranking"
keywords = ["retrieval", "search", "reranking", "maxsim", "colbert"]
categories = ["algorithms", "text-processing"]
include = [
  "/src",
  "/examples",
  "/build.rs",
  "/README.md",
  "/ARCHITECTURE.md",
  "/STORE_FORMAT.md",
  "/LICENSE",
  "/NOTICE",
]

[dependencies]
getrandom = "0.4"
matrixmultiply = "0.3"
memmap2 = "0.9"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
# float_roundtrip: a manifest's committed_at must parse back to the exact f64 the
# writer returned, or `as_of` differs between writer and reader by an ULP.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "2.0"
tempfile = "3"

# Only reachable through the `openblas` feature, or on macOS where Accelerate
# is part of the operating system and therefore always present.
blas = { version = "0.23", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
blas = "0.23"
blas-src = { version = "0.14", default-features = false, features = ["accelerate"] }

[features]
default = []
# Route the MaxSim SGEMM through a system OpenBLAS rather than the bundled
# pure-Rust kernel. Worth about 1.75x on the kernel, at the cost of requiring
# `libopenblas.so.0` -- exporting the plain Fortran symbol `sgemm_` -- at both
# link and load time. Set OPENBLAS_LIB_DIR if it lives outside the linker's
# default search path. See ARCHITECTURE.md, "The SGEMM dependency".
openblas = ["dep:blas"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
