[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "lateweave"
version = "0.1.0"
description = "Composable candidate generation and optional late-interaction reranking"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
dependencies = [
  "numpy>=1.26,<3; python_version < '3.14'",
  # No numpy before 2.3 ships a cp314 wheel.
  "numpy>=2.3,<3; python_version >= '3.14'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "maturin>=1.8,<2"]

[tool.maturin]
module-name = "lateweave._native"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
