[package]
name = "lateweave-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Python bindings for lateweave"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
lateweave = { path = "../.." }
numpy = "0.29"
pyo3 = "0.29"

[features]
default = []
openblas = ["lateweave/openblas"]
