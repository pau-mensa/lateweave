[package]
name = "lateweave-maxsim-bench"
version = "0.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
blas = "0.23"
numpy = "0.24.0"
pyo3 = { version = "0.24.2", features = ["extension-module"] }
rayon = "1.10"

[target.'cfg(target_os = "macos")'.dependencies]
blas-src = { version = "0.11", default-features = false, features = ["accelerate"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
